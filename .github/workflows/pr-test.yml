name: PR Test

on: [pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Use Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 20
          package-manager-cache: false
      - name: Setup Ruby
        uses: ruby/setup-ruby@f26937343756480a8cb3ae1f623b9c8d89ed6984
        with:
          ruby-version: '3.1'
      - name: Install dependencies
        run: yarn
      - name: Build packages
        run: yarn build
      - name: Run linter
        run: yarn lint
      - name: Run tests
        run: yarn test
      - name: Initialize react native app
        run: yarn workspace @brandingbrand/code-example prebuild --build internal --env prod --platform android --verbose

  template-versions:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.list.outputs.versions }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: List supported react-native template versions
        id: list
        run: echo "versions=$(ls packages/templates/react-native | jq --raw-input --slurp --compact-output 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  test-templates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: template-versions
    strategy:
      fail-fast: false
      matrix:
        rn-version: ${{ fromJSON(needs.template-versions.outputs.versions) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Use Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 20
          package-manager-cache: false
      - name: Install dependencies
        run: yarn
      - name: Build packages
        run: yarn build
      - name: Run tests against react-native ${{ matrix.rn-version }} template
        run: yarn test
        env:
          FLAGSHIP_CODE_TEST_RN_VERSION: ${{ matrix.rn-version }}
