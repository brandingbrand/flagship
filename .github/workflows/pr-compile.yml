name: PR Compile

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/templates/**'
      - 'apps/example/**'
      - '.github/workflows/pr-compile.yml'

jobs:
  android:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Use Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          package-manager-cache: false
      - name: Setup Ruby
        uses: ruby/setup-ruby@f26937343756480a8cb3ae1f623b9c8d89ed6984
        with:
          ruby-version: '3.1'
      - name: Setup Java
        uses: actions/setup-java@6a0805fcefea3d4657a47ac4c165951e33482018
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install dependencies
        run: yarn
      - name: Build packages
        run: yarn build
      - name: Initialize react native app
        run: yarn workspace @brandingbrand/code-example prebuild --build internal --env prod --platform android --verbose
      - name: Compile Android app
        run: ./gradlew assembleDebug
        working-directory: apps/example/android

  ios:
    if: github.actor != 'dependabot[bot]'
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Use Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          package-manager-cache: false
      - name: Setup Ruby
        uses: ruby/setup-ruby@f26937343756480a8cb3ae1f623b9c8d89ed6984
        with:
          ruby-version: '3.1'
      - name: Install dependencies
        run: yarn
      - name: Build packages
        run: yarn build
      - name: Initialize react native app
        run: yarn workspace @brandingbrand/code-example prebuild --build internal --env prod --platform ios --verbose
      - name: Compile iOS app
        run: xcodebuild -workspace app.xcworkspace -scheme app -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
        working-directory: apps/example/ios
